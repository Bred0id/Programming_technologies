services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./db/.db.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  init:
    build: ./backend
    command: ["python3", "init_db.py"]
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/users')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    image: nginx:alpine
    ports:
      - "8189:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/styles.css:/usr/share/nginx/html/static/styles.css
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: